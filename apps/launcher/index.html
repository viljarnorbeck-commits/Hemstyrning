<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Hemstyrning</title><link rel="stylesheet" href="style.css"></head><body><main><small>HEMSTYRNING 2.0</small><h1>Välkommen hem.</h1><p>Öppna ditt hem i ett eget fönster. Servern hanterar inloggning, Home Assistant och alla uppdateringar av gränssnittet.</p><form><label>Serveradress<input name="server" type="url" placeholder="https://hemstyrning.example" required></label><label>Vy<select name="role"><option value="home">Hem</option><option value="3d">3D</option><option value="list">Lista</option><option value="control">Kontrollpanel</option><option value="tv">TV-visning</option><option value="last">Senast använda vy</option></select></label><button>Öppna Hemstyrning</button></form><p role="status"></p><p>Du kan öppna flera fönster för olika skärmar. Inga HA-token sparas i appen. Installera serverns betrodda CA om du använder egen HTTPS.</p></main><script src="launcher.js"></script></body></html>
